[project]
name = "ward-substitute-teacher-sms"
version = "0.1.0"
description = "SMS-only substitute teacher finder for a small congregation"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "twilio>=9.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
subctl = "cli.subctl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
