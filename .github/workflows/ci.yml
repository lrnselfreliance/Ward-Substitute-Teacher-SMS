name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]" pyflakes

      - name: Lint
        run: python -m pyflakes app cli tests

      - name: Test
        # TZ is load-bearing: quiet hours and nth_sunday() resolve in local
        # time, so the suite pins a zone rather than inheriting the runner's.
        env:
          TZ: America/Denver
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ward-substitute-teacher-sms:ci .
      - name: Boot in poll mode and check health
        run: |
          docker run -d --name ci -e TZ=America/Denver -e INBOUND_MODE=poll \
            -p 8080:8080 ward-substitute-teacher-sms:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/health
          docker logs ci
          docker rm -f ci
